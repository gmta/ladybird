<!DOCTYPE html>
<style>
body {
    margin: 0;
    width: 800px;
    height: 600px;
    overflow: hidden;
}

#target {
    position: relative;
    height: 200px;
    background: #e3e2db;
}

#target > div {
    position: absolute;
    bottom: -40px;
    left: 0;
    width: 300px;
    height: 120px;
    background: black;
    border-bottom: 40px solid #222;
}

#clip {
    position: absolute;
    top: 700px;
    width: 50px;
    height: 50px;
    background: rgb(128, 0, 127);
}
</style>
<div id="target"><div></div></div>
<div id="clip"></div>
